name: Docker Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  docker-smoke-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test-script:
          - ./tests/docker-arch
          - ./tests/docker-ubuntu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run smoke test
        run: ${{ matrix.test-script }}
